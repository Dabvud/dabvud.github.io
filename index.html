<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Alle Apps von Dabvud an einem Ort.">
  <meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#13161c" media="(prefers-color-scheme: dark)">
  <title>Dabvud – Apps</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="head-row">
        <h1>Dabvud</h1>
        <button type="button" id="share-open" class="share-open">Teilen</button>
      </div>
      <p>Meine Apps</p>
    </header>
    <main id="apps" class="apps">
      <noscript>
        <article class="app">
          <img class="app-icon" src="icons/impostor.png" alt="" width="64" height="64">
          <h2 class="app-name">Impostor</h2>
          <p class="app-text">Partyspiel mit Fußballern – ein Handy, reihum.</p>
          <p class="app-meta">Web-App</p>
          <div class="app-actions">
            <a class="btn btn-primary" href="/impostor/">Spielen</a>
            <a class="btn" href="/impostor/?installieren">📲 Aufs Handy</a>
          </div>
        </article>
        <article class="app">
          <img class="app-icon" src="icons/thenextchapter.png" alt="" width="64" height="64">
          <h2 class="app-name">The Next Chapter</h2>
          <p class="app-text">Errate NBA-Spieler an ihrer Karriere – Station für Station.</p>
          <p class="app-meta">Web-App</p>
          <div class="app-actions">
            <a class="btn btn-primary" href="/thenextchapter/">Spielen</a>
            <a class="btn" href="/thenextchapter/?installieren">📲 Aufs Handy</a>
          </div>
        </article>
      </noscript>
    </main>
    <footer>
      <p><a href="https://github.com/Dabvud">Dabvud auf GitHub</a></p>
    </footer>
  </div>

  <dialog id="share-dialog" class="share-dialog" aria-labelledby="share-title">
    <h2 id="share-title">Apps teilen</h2>
    <p>Mit der Handy-Kamera scannen, um diese Seite zu öffnen.</p>
    <svg class="qr" role="img" aria-label="QR-Code zu dabvud.github.io" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 29 29" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h29v29H0z"/><path stroke="#000000" d="M2 2.5h7m4 0h1m2 0h1m1 0h1m1 0h7M2 3.5h1m5 0h1m7 0h3m1 0h1m5 0h1M2 4.5h1m1 0h3m1 0h1m1 0h1m3 0h1m2 0h1m2 0h1m1 0h3m1 0h1M2 5.5h1m1 0h3m1 0h1m1 0h7m3 0h1m1 0h3m1 0h1M2 6.5h1m1 0h3m1 0h1m1 0h1m3 0h2m2 0h1m1 0h1m1 0h3m1 0h1M2 7.5h1m5 0h1m1 0h3m4 0h2m1 0h1m5 0h1M2 8.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M10 9.5h1m2 0h2m3 0h1M2 10.5h1m1 0h5m3 0h1m1 0h4m2 0h5M3 11.5h1m1 0h1m1 0h1m1 0h4m1 0h1m1 0h1m1 0h1m2 0h1m3 0h1M3 12.5h1m2 0h1m1 0h1m1 0h5m1 0h2m2 0h1m2 0h1m1 0h2M2 13.5h5m4 0h2m3 0h1m1 0h4m4 0h1M2 14.5h1m1 0h5m3 0h1m1 0h3m2 0h2m1 0h1m1 0h3M2 15.5h1m2 0h2m2 0h1m1 0h2m8 0h1m1 0h1m1 0h1M2 16.5h1m2 0h6m1 0h4m1 0h1m2 0h4m1 0h2M2 17.5h1m3 0h1m4 0h3m3 0h2m2 0h2m3 0h1M2 18.5h1m4 0h2m3 0h4m1 0h6m1 0h1M10 19.5h3m1 0h2m1 0h2m3 0h2M2 20.5h7m2 0h1m3 0h2m1 0h1m1 0h1m1 0h1m1 0h3M2 21.5h1m5 0h1m1 0h4m4 0h1m3 0h2m1 0h2M2 22.5h1m1 0h3m1 0h1m1 0h2m1 0h10m1 0h1M2 23.5h1m1 0h3m1 0h1m1 0h1m2 0h3m3 0h2m1 0h5M2 24.5h1m1 0h3m1 0h1m1 0h2m7 0h1m3 0h2m1 0h1M2 25.5h1m5 0h1m3 0h2m2 0h1m1 0h6m2 0h1M2 26.5h7m1 0h2m1 0h4m4 0h6"/></svg>
    <p class="share-url">dabvud.github.io</p>
    <form method="dialog">
      <button type="submit" class="btn">Schließen</button>
    </form>
  </dialog>

  <script>
    const APPS = [
      {
        name: "Impostor",
        text: "Partyspiel mit Fußballern – ein Handy, reihum.",
        icon: "icons/impostor.png",
        link: "/impostor/",
        art: "Web-App",
      },
      {
        name: "The Next Chapter",
        text: "Errate NBA-Spieler an ihrer Karriere – Station für Station.",
        icon: "icons/thenextchapter.png",
        link: "/thenextchapter/",
        art: "Web-App",
      },
    ];

    function button(label, href, primary) {
      const a = document.createElement("a");
      a.className = primary ? "btn btn-primary" : "btn";
      a.href = href;
      a.textContent = label;
      return a;
    }

    function renderApps(apps) {
      const container = document.getElementById("apps");

      for (const app of apps) {
        const card = document.createElement("article");
        card.className = "app";

        const icon = document.createElement("img");
        icon.className = "app-icon";
        icon.src = app.icon;
        icon.alt = "";
        icon.width = 64;
        icon.height = 64;

        const name = document.createElement("h2");
        name.className = "app-name";
        name.textContent = app.name;

        const text = document.createElement("p");
        text.className = "app-text";
        text.textContent = app.text;

        const meta = document.createElement("p");
        meta.className = "app-meta";
        meta.textContent = app.art;

        const actions = document.createElement("div");
        actions.className = "app-actions";
        actions.append(
          button("Spielen", app.link, true),
          button("📲 Aufs Handy", app.link + "?installieren", false),
        );

        card.append(icon, name, text, meta, actions);
        container.append(card);
      }
    }

    renderApps(APPS);

    const shareDialog = document.getElementById("share-dialog");
    document.getElementById("share-open").addEventListener("click", () => shareDialog.showModal());
    // Klick neben den Dialog schließt ihn
    shareDialog.addEventListener("click", (e) => { if (e.target === shareDialog) shareDialog.close(); });
  </script>
</body>
</html>
